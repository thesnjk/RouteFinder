name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: RouteFinder
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build macOS app
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Fleet E2E smoke
        run: bash Scripts/fleet-e2e-smoke.sh

      - name: Dependency audit
        run: swift package audit || true

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS library targets for simulator
        working-directory: RouteFinder
        run: |
          xcodebuild build \
            -scheme RouteFinderIOS \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
            -scheme RouteFinderIOS \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run RouteFinderApp UI smoke tests
        run: |
          set -e
          if xcodebuild test \
            -project RouteFinderApp.xcodeproj \
            -scheme RouteFinderApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:RouteFinderAppUITests/RouteFinderAppUITests \
            | xcpretty; then
            exit 0
          fi
          xcodebuild test \
            -project RouteFinderApp.xcodeproj \
            -scheme RouteFinderApp \
            -destination 'generic/platform=iOS Simulator' \
            -only-testing:RouteFinderAppUITests/RouteFinderAppUITests \
            | xcpretty || xcodebuild test \
            -project RouteFinderApp.xcodeproj \
            -scheme RouteFinderApp \
            -destination 'generic/platform=iOS Simulator' \
            -only-testing:RouteFinderAppUITests/RouteFinderAppUITests
